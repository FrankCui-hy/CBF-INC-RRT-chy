seed: 42
device: cuda

paths:
  output_root: loss/outputs_real_v2
  dataset_path: loss/outputs_real_v2/datasets/raycast_dataset_real_v2.pt
  g_phi_ckpt: loss/outputs_real_v2/checkpoints/g_phi_last.pt
  h_theta_ckpt: loss/outputs_real_v2/checkpoints/h_theta_last.pt

system:
  n_ego: 7
  n_obs: 7
  rays: 2048
  dt: 0.0333333
  q_limits_ego:
    low: [-2.7, -1.7, -2.7, -3.0, -2.7, -0.1, -2.7]
    high: [2.7, 1.7, 2.7, 0.0, 2.7, 3.7, 2.7]
  q_limits_obs:
    low: [-2.7, -1.7, -2.7, -3.0, -2.7, -0.1, -2.7]
    high: [2.7, 1.7, 2.7, 0.0, 2.7, 3.7, 2.7]

data:
  n_episodes: 220
  episode_len: 40
  dynamic_episode_ratio: 0.7
  sigma_dynamic: 0.06
  sigma_static_obs: 0.07
  sigma_static_ego: 0.00
  train_split: 0.9
  num_workers: 0
  save_format: pt
  safe_dist: 0.28
  unsafe_dist: 0.16
  ray_mode: cone
  cone_half_angle_deg: 85.0
  ray:
    range_max: 5.0
    no_hit_point_fill: 0.0
  real:
    robot_name: panda
    obstacle_robot_name: panda
    obstacle_traj_path: data/obstacle_trajs/panda_trajs.npz
    obstacle_robot_base_pos: [0.33, 0.0, 0.0]
    obstacle_robot_base_orn: [0.0, 0.0, 0.0, 1.0]
    gui: false
    sensor_link_mode: mid
    ray_mode: cone
    cone_half_angle_deg: 85.0
    cone_axis_mode: target_tracking
    ray_mixture:
      enabled: false
      sphere_ratio: 0.7
    near_episode_ratio: 0.0
    near_base_mode: around_ego
    near_ego_offset_center: [0.14, 0.0, 0.05]
    near_ego_offset_jitter: [0.07, 0.07, 0.07]
    near_obstacle_base_pos: [0.10, 0.0, 0.15]
    near_obstacle_base_pos_jitter: [0.04, 0.05, 0.05]

model:
  g_phi:
    hidden_dims: [256, 256, 256]
    activation: silu
    predict_hit_prob: true
    norm_eps: 1.0e-6
  h_theta:
    encoder: pointnet
    point_feat_dim: 64
    global_feat_dim: 128
    hidden_dims: [256, 256]
    activation: silu
    include_hit_prob: true

loss:
  obs:
    huber_delta: 0.05
    lambda_p: 1.0
    lambda_m: 2.0
    lambda_r: 0.5
    eps: 1.0e-6
    match_mode: chamfer
    chamfer_p2q_weight: 1.0
    chamfer_q2p_weight: 1.8
    pred_mask_mode: pred_hit
    pred_hit_tau: 0.8
    max_points: 1024
    normal_mode: matched_absdot
    unsigned_normal: true
    lambda_n: 1.2
    normal_match_max_dist: 0.015
    normal_bidirectional: true
    hard_example_weighting: false
    hard_w_max: 3.0
    hard_residual_clip: 0.20
    normal_loss_mode: dot2
  cbf:
    alpha: 1.0
    gamma_s: 0.2
    gamma_u: -0.2
    sign_mode: standard
    w_cbf: 1.0
    w_cls: 1.0

train:
  g_phi:
    epochs: 200
    batch_size: 128
    lr: 1.0e-3
    weight_decay: 1.0e-5
    grad_clip_norm: 10.0
    log_every: 50
    use_tensorboard: false
    resume: false
    use_lambda_n_schedule: true
    lambda_n_stage1: 0.2
    lambda_n_stage2: 0.7
    lambda_n_stage1_epochs: 80
  h_theta:
    epochs: 200
    batch_size: 64
    lr: 5.0e-4
    weight_decay: 1.0e-5
    grad_clip_norm: 10.0
    log_every: 50
    use_tensorboard: false
    freeze_g_phi: true
    derivative_mode: composite_jvp
    resume: false

eval:
  qp:
    u_min: [-1.5, -1.5, -1.5, -1.5, -1.5, -1.5, -1.5]
    u_max: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
    alpha: 1.0
