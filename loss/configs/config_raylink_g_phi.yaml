seed: 0
device: cuda

data:
  dataset_dir: dataset/neural_raycast_full
  num_workers: 4
  pos_weight_chunk_size: 4096

paths:
  out_dir: loss/outputs_raylink_g_phi

model:
  pair_hidden_dim: 128
  head_hidden_dims: [128, 64]
  link_embed_dim: 8
  anchor_embed_dim: 8
  activation: silu
  finger_open: 0.04

train:
  batch_size: 128
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  lr_factor: 0.5
  lr_patience: 5
  early_stopping_patience: 15
  grad_clip_norm: 10.0
  amp: true

loss:
  lambda_hit: 1.0
  lambda_depth: 5.0

eval:
  near_recall_target: 0.95
  collision_recall_target: 0.98
  thresholds:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90
    - 0.95
